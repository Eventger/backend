# Identidad y URL se configuran mediante variables de Actions, nunca con tokens aquí.
sonar.projectName=Eventger Backend
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests.py,**/test_*.py,**/tests/**
sonar.exclusions=**/tests.py,**/test_*.py,**/tests/**,.venv/**,venv/**,node_modules/**,**/__pycache__/**,reports/**,htmlcov/**,.ruff_cache/**,.scannerwork/**,coverage.xml
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=false
