name: Backend CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    name: Conventional Commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validar commits reales y título del PR
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          npm run commitlint -- --from "$PR_BASE" --to "$PR_HEAD"
          printf '%s\n' "$PR_TITLE" | npm run commitlint -- --config ci/commitlint-pr.config.cjs
      - name: Alcance fuera de PR
        if: github.event_name != 'pull_request'
        run: |
          echo 'Validación de commits aplicable a PR; no se revisa historial anterior.' >> "$GITHUB_STEP_SUMMARY"
      - name: Resumen
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf 'Conventional Commits: %s. Ante error, corrige el mensaje indicado con tipo(scope opcional): descripción.\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Comprobaciones de Python y Django
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-ci.txt
      - run: python -m ruff check .
      - run: python manage.py check
      - name: Resumen
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf 'Python y Django: %s. Revisa el archivo y la línea indicados en el paso fallido.\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Pruebas Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
    services:
      postgres:
        image: postgres:17.9-bookworm
        env:
          POSTGRES_DB: eventger_ci
          POSTGRES_USER: eventger_ci
          POSTGRES_PASSWORD: eventger_ci_only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U eventger_ci -d eventger_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-ci.txt
      - name: Suite completa
        run: |
          python -m coverage run manage.py test --noinput --verbosity 2
      - name: Cobertura disponible incluso si falla la suite
        if: always() && hashFiles('.coverage') != ''
        run: |
          python -m coverage xml
          python -m coverage report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-evidence-${{ github.sha }}
          path: |
            reports/
            coverage.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Resumen
        if: always()
        env:
          RESULT: ${{ job.status }}
          REVISION: ${{ github.sha }}
        run: |
          printf 'Pruebas Backend: %s; revisión %s. Evidencias: backend-evidence-%s.\n' "$RESULT" "$REVISION" "$REVISION" >> "$GITHUB_STEP_SUMMARY"
          echo 'PostgreSQL aislado y migraciones Django. Esquema de dominio Supabase pendiente de SQL verificable.' >> "$GITHUB_STEP_SUMMARY"

  sonar:
    name: Análisis Sonar
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SONAR_ENABLED: ${{ vars.SONAR_ENABLED }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Activación y configuración
        shell: bash
        run: |
          if [[ "$SONAR_ENABLED" != 'true' ]]; then
            echo 'Sonar: análisis no ejecutado (SONAR_ENABLED no es true).' >> "$GITHUB_STEP_SUMMARY"
          else
            for name in SONAR_HOST_URL SONAR_PROJECT_KEY SONAR_TOKEN; do
              if [[ -z "${!name}" ]]; then
                echo "::error::Falta configurar $name para activar Sonar."
                exit 1
              fi
            done
            if [[ "$SONAR_HOST_URL" != https://* ]]; then
              echo '::error::SONAR_HOST_URL debe usar HTTPS.'
              exit 1
            fi
            if [[ "$SONAR_HOST_URL" == *sonarcloud.io* || "$SONAR_HOST_URL" == *sonarqube.us* ]]; then
              if [[ -z "$SONAR_ORGANIZATION" ]]; then
                echo '::error::SonarQube Cloud requiere SONAR_ORGANIZATION.'
                exit 1
              fi
            fi
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_ENABLED == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.SONAR_ENABLED == 'true'
        with:
          name: backend-evidence-${{ github.sha }}
      - name: Parámetros locales del scanner
        if: env.SONAR_ENABLED == 'true'
        run: |
          python ci/sonar_properties.py
      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        if: env.SONAR_ENABLED == 'true'
      - name: Resumen del scanner
        if: success() && env.SONAR_ENABLED == 'true'
        run: |
          echo 'Scanner ejecutado y análisis enviado. El procesamiento y el Quality Gate se verifican en Sonar; no se bloquea por Quality Gate en esta etapa.' >> "$GITHUB_STEP_SUMMARY"
